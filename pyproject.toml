[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localmind"
version = "1.0.0"
description = "A fully offline AI assistant built on small language models, with a measurement habit."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["llm", "slm", "ollama", "offline", "edge", "benchmark", "quantization"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Environment :: Console",
]
dependencies = [
  "requests>=2.31",
  "pydantic>=2.6",
  "typer>=0.12",
  "rich>=13.7",
  "psutil>=5.9",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]

[project.scripts]
localmind = "localmind.cli:main"

[tool.setuptools.packages.find]
include = ["localmind*", "api*"]

[tool.setuptools.package-data]
localmind = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "C4"]
ignore = ["UP037"]

[tool.ruff.lint.per-file-ignores]
# Typer's whole API is `def cmd(x: int = typer.Option(...))`.
"localmind/cli.py" = ["B008"]
"tests/*" = ["C408"]
