name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[api,dev]"
      # The whole suite runs against tools/mock_ollama.py, so CI needs no GPU,
      # no model weights and no network beyond PyPI.
      - name: Test
        run: pytest -q
      - name: Lint
        run: ruff check localmind api tools tests
